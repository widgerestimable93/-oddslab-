name: Validate OddsLab

on:
  push:
    branches: [ main ]
    paths:
      - "Code.gs"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "icon-192.png"
      - "icon-512.png"
      - "tests/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "Code.gs"
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "icon-192.png"
      - "icon-512.png"
      - "tests/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate app and probability model
        run: node tests/validate-project.cjs
